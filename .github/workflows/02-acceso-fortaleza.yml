name: Acceso a la fortaleza

on: push

jobs:
    reporte-de-reclutamiento:
        runs-on: ubuntu-latest

        steps: 
            - name: Agente llega a la Fortaleza
              run: |
               echo "Agente ${{github.actor}} llega a la fortaleza"
               echo ""
               echo "Buscar los archivos de la legion"
               ls -la
               echo ""
               echo "No hay nada"
            
            - name: "Se desbloquea la boveda"
              uses: actions/checkout@v4

            - name : "Ahora si funciona"
              run: |
               echo "Buscar los archivos de la legion"
               ls -la
               echo "Funciona"
               echo ""
               echo "Planes"
               ls /planes
               echo "Villanos"
               ls /villanos
               echo "Inteligencia"
               ls /inteligencia